name: Apply corrected GymMinimal v3 snapshot

on:
  push:
    branches:
      - import/gymminimal-v3-corrected-snapshot

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import/gymminimal-v3-corrected-snapshot
          fetch-depth: 0
      - name: Extract only project files and commit the snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          archive="$RUNNER_TEMP/GymMinimal-v3-full.zip"
          git show origin/main:GymMinimal-v3-full.zip > "$archive"

          python3 - "$archive" <<'PY'
          import os, re, stat, sys, zipfile
          from collections import Counter
          from pathlib import Path, PurePosixPath

          archive = sys.argv[1]
          copied = 0
          skipped = Counter()
          expected = {
              "lib/services/minimal_insights.dart",
              "test/minimal_today_stats_test.dart",
              "docs/design/minimal-gymmane-v3.html",
              "lib/app/app_shell.dart",
              "lib/screens/progress_screen.dart",
              "lib/screens/home_screen.dart",
              "lib/screens/session_screen.dart",
              "lib/screens/history_screen.dart",
              "lib/screens/exercises_screen.dart",
          }
          found = set()

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path rejected")
                  if not p.parts or p.parts[0] != "gymminimal":
                      raise SystemExit("Unexpected archive root")
                  rel_parts = p.parts[1:]
                  if not rel_parts:
                      continue
                  rel = str(PurePosixPath(*rel_parts))
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit("Symlink entry rejected")

                  # Keep this repository's own CI workflows and signing material.
                  if rel == ".github" or rel.startswith(".github/"):
                      skipped["repository CI/workflows"] += 1
                      continue
                  parts_lower = [x.lower() for x in rel_parts]
                  leaf = rel_parts[-1].lower()
                  if "keystore" in parts_lower or leaf in {
                      "key.properties", "local.properties", "google-services.json"
                  } or leaf.startswith(".env") or re.search(r"\.(jks|keystore|p12|pfx|pem|p8)$", leaf):
                      skipped["signing/local/secret configuration"] += 1
                      continue

                  destination = Path(rel)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(info))
                  if mode:
                      os.chmod(destination, 0o755 if mode & 0o111 else 0o644)
                  copied += 1
                  found.add(rel)

              bad = z.testzip()
              if bad:
                  raise SystemExit("ZIP CRC failed at " + bad)

          missing = expected - found
          if missing:
              raise SystemExit("Required snapshot files missing: " + ", ".join(sorted(missing)))

          print("Snapshot files applied:", copied)
          print("Protected entries skipped:", dict(skipped))
          print("Required corrected-code files verified:", len(expected))
          print("Existing repository-only files were left untouched.")
          PY

          # Remove only the temporary inspection workflows created for this import.
          rm -f .github/workflows/inspect-v3-snapshot.yml
          rm -f .github/workflows/review-v3-code-diff.yml
          rm -f .github/workflows/apply-v3-snapshot.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "FILES IN IMPORT COMMIT:"
          git diff --cached --name-status
          echo "IMPORT SUMMARY:"
          git diff --cached --stat
          git commit -m "import: apply corrected GymMinimal v3 snapshot"
          git push origin HEAD:import/gymminimal-v3-corrected-snapshot
