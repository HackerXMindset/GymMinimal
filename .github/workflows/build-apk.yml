name: Build & Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (defaults to minimal-mode-preview)'
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Analyze, test, build and publish one APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java and cache Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            android/gradle.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        id: dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        id: tests
        run: flutter test

      - name: Verify repository Android signing keystore
        id: signing
        if: always() && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          KEYSTORE="android/keystore/lifetracker.p12"
          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Repository signing keystore is missing: $KEYSTORE"
            exit 1
          fi

          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" -storepass lifetracker -alias lifetracker >/dev/null
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Allocate a higher Android version code for every CI build
        id: android-build-number
        if: always() && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "value=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using Android version code: $BUILD_NUMBER"

      - name: Build one installable APK
        id: build-apk
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter build apk --release --target-platform android-arm64 --build-number "${{ steps.android-build-number.outputs.value }}"

      - name: Rename APK
        id: rename-apk
        if: always() && steps.build-apk.outcome == 'success'
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GymMinimal.apk

      - name: Upload single APK artifact
        if: always() && steps.rename-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gymminimal-apk
          path: build/app/outputs/flutter-apk/GymMinimal.apk
          if-no-files-found: error

      - name: Select release destination
        id: release
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TAG="pr-${PR_NUMBER}-preview"
            NAME="GymMinimal — PR #${PR_NUMBER}"
            if [[ "$PR_SOURCE_REPO" == "$GITHUB_REPOSITORY" ]]; then
              PUBLISH=true
            else
              PUBLISH=false
              echo "::notice::Fork PRs build an Actions artifact only; GitHub does not grant them write access to repository Releases."
            fi
          else
            TAG="${DISPATCH_TAG:-minimal-mode-preview}"
            NAME="GymMinimal — Minimal Mode"
            PUBLISH=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Point this preview tag at the built commit
        if: always() && steps.build-apk.outcome == 'success' && steps.release.outputs.publish == 'true' && steps.signing.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

      - name: Remove previous APK assets from this preview release
        if: always() && steps.build-apk.outcome == 'success' && steps.release.outputs.publish == 'true' && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mapfile -t old_apks < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".apk"))')
            for asset in "${old_apks[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          fi

      - name: Publish the built APK to GitHub Releases
        if: always() && steps.build-apk.outcome == 'success' && steps.release.outputs.publish == 'true' && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          body: |
            Automatically updated, signed GymMinimal preview build.

            Source commit: ${{ github.sha }}
            Trigger: ${{ github.event_name }}
            Analysis result: ${{ steps.analyze.outcome }}
            Test result: ${{ steps.tests.outcome }}
            Pull request: ${{ github.event.pull_request.html_url || 'not applicable' }}

            Download GymMinimal.apk and install it over the previous preview build.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/app/outputs/flutter-apk/GymMinimal.apk

      - name: Explain why the APK was not published as a Release
        if: always() && steps.build-apk.outcome == 'success' && steps.release.outputs.publish != 'true'
        run: |
          echo "The APK remains available in this run's Actions artifacts."
          echo "Fork PRs do not have permission to publish repository Releases."
